---
# The NAS address is site-specific, so it is not in this repository. This file
# is created once with placeholders and then never touched again: editing it
# here would be pointless, because the next ansible-pull would overwrite it.
- name: Install cifs-utils for CIFS mounts
  ansible.builtin.apt:
    name: cifs-utils
    state: present

- name: Create the NAS configuration file with placeholders (only once)
  ansible.builtin.copy:
    dest: "{{ nas_conf_file }}"
    owner: root
    group: root
    mode: "0600"
    force: false
    content: |
      # Lab NAS configuration.
      #
      # Fill in NAS_HOST, then put the username and password in
      # {{ nas_credentials_file }} (mode 0600, root-owned):
      #
      #     sudo sh -c 'printf "username=YOUR_USER\npassword=YOUR_PASS\n" \
      #       > {{ nas_credentials_file }} && chmod 600 {{ nas_credentials_file }}'
      #
      # Then run: sudo lab_update
      #
      # The share name is fixed by the role ({{ nas_share }}).
      NAS_HOST=

- name: Read the NAS configuration file
  ansible.builtin.slurp:
    src: "{{ nas_conf_file }}"
  register: nas_conf_raw

- name: Parse NAS_HOST from the configuration file
  ansible.builtin.set_fact:
    nas_host: >-
      {{ (nas_conf_raw.content | b64decode).splitlines()
         | select('match', '^\s*NAS_HOST\s*=')
         | map('regex_replace', '^\s*NAS_HOST\s*=\s*', '')
         | map('regex_replace', '\s+$', '')
         | first | default('') }}

- name: Check whether the credentials file exists
  ansible.builtin.stat:
    path: "{{ nas_credentials_file }}"
  register: nas_credentials

# Not configured is a normal state, not a failure: a laptop must converge
# cleanly before anyone has filled these in.
- name: Report that the NAS is not configured yet
  ansible.builtin.debug:
    msg:
      - "NAS is not configured on this laptop; skipping the mount."
      - "  1. Set NAS_HOST in {{ nas_conf_file }}"
      - "  2. Put username/password in {{ nas_credentials_file }} (chmod 600)"
      - "  3. Run: sudo lab_update"
  when: nas_host | length == 0 or not nas_credentials.stat.exists

# Ownership is deliberately NOT managed here. Once the share is mounted, the
# CIFS uid=/gid= options decide what the mount point appears to be owned by,
# so asserting root:root here would flip back and forth and report "changed"
# on every single run.
- name: Create the NAS mount point
  ansible.builtin.file:
    path: "{{ nas_mount_path }}"
    state: directory
    mode: "0755"
  when: nas_host | length > 0 and nas_credentials.stat.exists

- name: Mount the NAS share and persist it in fstab
  ansible.posix.mount:
    path: "{{ nas_mount_path }}"
    src: "//{{ nas_host }}/{{ nas_share }}"
    fstype: cifs
    opts: "{{ nas_mount_opts }}"
    state: mounted
  when: nas_host | length > 0 and nas_credentials.stat.exists

# --- Desktop shortcut --------------------------------------------------------
# A symlink rather than a .desktop launcher: it opens in the file manager with
# no "untrusted launcher" prompt, and it keeps working when the share is
# unmounted (it just shows as a broken link until the NAS is reachable).
#
# Deliberately NOT a shell task: Ansible runs `shell` under /bin/sh, which is
# dash on Mint, so bash-only expansions such as ${var//a/b} fail there with
# "Bad substitution" (and pass silently on machines where /bin/sh is bash).
# Everything below is declarative and therefore shell-independent.
- name: Look up the local user accounts
  ansible.builtin.getent:
    database: passwd
  register: nas_passwd
  when: nas_host | length > 0 and nas_credentials.stat.exists

# Human accounts only: UID >= 1000 and a home directory under /home.
- name: Select the users who should get the Desktop shortcut
  ansible.builtin.set_fact:
    nas_desktop_candidates: >-
      {{ nas_passwd.ansible_facts.getent_passwd
         | dict2items
         | selectattr('value.1', 'ge', '1000')
         | selectattr('value.4', 'match', '^/home/')
         | map(attribute='key')
         | list }}
  when: nas_host | length > 0 and nas_credentials.stat.exists

- name: Read each user's XDG desktop directory setting
  ansible.builtin.slurp:
    src: "{{ item.value.4 }}/.config/user-dirs.dirs"
  loop: "{{ nas_passwd.ansible_facts.getent_passwd | dict2items | selectattr('key', 'in', nas_desktop_candidates | default([])) | list }}"
  loop_control:
    label: "{{ item.key }}"
  register: nas_xdg_raw
  failed_when: false
  when: nas_host | length > 0 and nas_credentials.stat.exists

# Resolve each user's Desktop path: honour XDG_DESKTOP_DIR when set, else
# fall back to ~/Desktop. $HOME inside the config is expanded to the real path.
- name: Resolve the Desktop path for each user
  ansible.builtin.set_fact:
    nas_desktop_paths: >-
      {%- set out = {} -%}
      {%- for r in nas_xdg_raw.results | default([]) -%}
      {%-   set raw = (r.content | default('') | b64decode) -%}
      {%-   set found = raw | regex_findall('XDG_DESKTOP_DIR="([^"]*)"') -%}
      {%-   set rel = (found | first | default('$HOME/Desktop')) | replace('$HOME', '') | regex_replace('^/', '') -%}
      {%-   set _ = out.update({ r.item.key: rel }) -%}
      {%- endfor -%}
      {{ out }}
  when: nas_host | length > 0 and nas_credentials.stat.exists

- name: Check which Desktop directories actually exist
  ansible.builtin.stat:
    path: "{{ item.value.4 }}/{{ nas_desktop_paths[item.key] | default('Desktop') }}"
  loop: "{{ nas_passwd.ansible_facts.getent_passwd | dict2items | selectattr('key', 'in', nas_desktop_candidates | default([])) | list }}"
  loop_control:
    label: "{{ item.key }}"
  register: nas_desktop_stat
  when: nas_host | length > 0 and nas_credentials.stat.exists

- name: Create the NAS shortcut on each user's Desktop
  ansible.builtin.file:
    src: "{{ nas_mount_path }}"
    dest: "{{ item.item.value.4 }}/{{ nas_desktop_paths[item.item.key] | default('Desktop') }}/{{ nas_share }}"
    state: link
    owner: "{{ item.item.key }}"
    group: "{{ item.item.key }}"
    force: true
  loop: "{{ nas_desktop_stat.results | default([]) | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: nas_host | length > 0 and nas_credentials.stat.exists
