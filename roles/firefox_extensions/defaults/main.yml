---
# Enterprise policies for the distro (deb) Firefox shipped with Linux Mint.
# NOTE: this does NOT affect a Flatpak Firefox — the Flatpak build uses a
# separate profile and its own extension mechanism.
firefox_policies_dir: /etc/firefox/policies

# Extensions force-installed for every user. `id` is the AMO extension ID.
#
# install_url MUST use the AMO *slug* (/downloads/latest/<slug>/latest.xpi),
# NOT the extension GUID: the GUID-based /latest/ form 404s for some addons
# (e.g. uBlock Origin's GUID returns 404 while the slug works), which makes
# Firefox silently skip the force-install.
firefox_forced_extensions:
  - id: jid1-MnnxcxisBPnSXQ@jetpack     # Privacy Badger (slug: privacy-badger17)
    install_url: https://addons.mozilla.org/firefox/downloads/latest/privacy-badger17/latest.xpi
  - id: cjpalhdlnbpafiamejdnhcphjbkeiagm # uBlock Origin (slug: ublock-origin)
    install_url: https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi
