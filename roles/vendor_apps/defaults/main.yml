---
# All upstream URLs/versions are pinned HERE. Bump them when a new upstream
# release is wanted; everything else in the role follows automatically.

# --- lazygit: static binary from GitHub releases (no apt/Flathub package) ---
lazygit_version: "0.66.2"
lazygit_tarball_url: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_linux_x86_64.tar.gz"
lazygit_tarball_dest: "/var/cache/lab-downloads/lazygit_{{ lazygit_version }}_linux_x86_64.tar.gz"
lazygit_install_path: /usr/local/bin/lazygit

# --- FTS Data Explorer: raw binary from GitHub releases ---------------------
# The release ships a bare ELF (no .deb/AppImage). It links against
# X11/OpenGL, so the runtime libs are installed from apt alongside it.
fts_release_tag: "v.26.10.1"
fts_binary_url: "https://github.com/jmnich/fts_data_explorer/releases/download/{{ fts_release_tag }}/fts_data_explorer"
fts_install_path: /usr/local/bin/fts_data_explorer
fts_apt_deps:
  - libopengl0
  - libglu1-mesa
  - libgl1
  - libx11-6
  - libxcb1
  - libstdc++6

# --- Digilent WaveForms + Adept runtime (proprietary .debs) -----------------
# WaveForms requires the Adept runtime installed FIRST. files.digilent.com
# is Cloudflare-fronted, so downloads send a browser User-Agent.
#
# The .debs are NOT rebuilt for new Ubuntu bases, so their dependency lists
# are resolved against whatever the base provides. On Mint 22 (noble) the
# 64-bit time_t transition renamed libqt6core6/libqt6widgets6 to their *t64
# names; the *t64 packages carry `Provides: libqt6core6` / `libqt6widgets6`,
# so installing them by their real names is what makes the WaveForms Depends
# resolve. Do NOT "fix" this by installing the old names: they no longer exist.
digilent_adept_url: "https://files.digilent.com/Software/Adept2%20Runtime/2.30.1/digilent.adept.runtime_2.30.1_amd64.deb"
digilent_waveforms_url: "https://files.digilent.com/Software/Waveforms/3.25.1/digilent.waveforms_3.25.1_amd64.deb"
digilent_deb_dir: /var/cache/lab-downloads

# Minimum Adept runtime WaveForms accepts (its own Depends line).
digilent_adept_min_version: "2.27.9"

# Adept's own Depends, installed explicitly so a missing one is reported as a
# named package instead of a dpkg error. libgcc1 and libssl3 are NOT listed:
# they no longer exist as packages on noble, and are satisfied through
# `Provides:` by libgcc-s1 and libssl3t64 respectively.
digilent_adept_apt_deps:
  - libavahi-common3
  - libavahi-client3
  - libusb-1.0-0

# WaveForms' Depends, minus digilent.adept.runtime (installed separately and
# asserted first) and minus the Qt6 libraries, which are resolved by name
# below because they were renamed on noble.
digilent_waveforms_apt_deps:
  - xdg-utils
  - libgl1-mesa-dri
  - libqt6multimedia6
  - libqt6qml6
  - libqt6serialport6

# Qt6 library names differ across the fleet's bases. Map the name WaveForms
# asks for to the package that actually provides it on this base.
digilent_qt6_packages:
  "22":   # Mint 22 / Ubuntu noble: renamed in the 64-bit time_t transition
    - libqt6core6t64
    - libqt6widgets6t64
  "21":   # Mint 21 / Ubuntu jammy: original names
    - libqt6core6
    - libqt6widgets6

download_headers:
  User-Agent: "Mozilla/5.0 (X11; Linux x86_64; rv:132.0) Gecko/20100101 Firefox/132.0"
