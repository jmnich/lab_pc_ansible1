---
- name: Ensure download cache directory exists
  ansible.builtin.file:
    path: /var/cache/lab-downloads
    state: directory
    owner: root
    group: root
    mode: "0755"

# --- lazygit -----------------------------------------------------------------

- name: Check installed lazygit version
  ansible.builtin.command: "{{ lazygit_install_path }} --version"
  register: lazygit_current
  failed_when: false
  changed_when: false

- name: Read installed lazygit version
  ansible.builtin.set_fact:
    lazygit_installed_version: >-
      {{ (lazygit_current.stdout.split('version=')[1].split(',')[0])
         if 'version=' in lazygit_current.stdout else '' }}

- name: Determine whether lazygit needs an update
  ansible.builtin.set_fact:
    lazygit_outdated: "{{ lazygit_current.rc != 0 or lazygit_installed_version != lazygit_version }}"

- name: Download lazygit release tarball
  ansible.builtin.get_url:
    url: "{{ lazygit_tarball_url }}"
    dest: "{{ lazygit_tarball_dest }}"
    mode: "0644"
    timeout: 120
  when: lazygit_outdated | bool

# Extract to a staging dir first: the tarball also contains LICENSE/README,
# which must not land in /usr/local/bin.
# unarchive does not create dest, so create the staging dir explicitly.
- name: Ensure lazygit staging directory exists
  ansible.builtin.file:
    path: "{{ lazygit_tarball_dest }}.extracted"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: lazygit_outdated | bool

- name: Extract lazygit tarball to staging dir
  ansible.builtin.unarchive:
    src: "{{ lazygit_tarball_dest }}"
    dest: "{{ lazygit_tarball_dest }}.extracted"
    remote_src: false
  when: lazygit_outdated | bool

- name: Install lazygit binary
  ansible.builtin.copy:
    src: "{{ lazygit_tarball_dest }}.extracted/lazygit"
    dest: "{{ lazygit_install_path }}"
    remote_src: true
    mode: "0755"
  when: lazygit_outdated | bool

# --- FTS Data Explorer -------------------------------------------------------

- name: Install FTS Data Explorer runtime libraries (X11/OpenGL)
  ansible.builtin.apt:
    name: "{{ fts_apt_deps }}"
    state: present

- name: Install FTS Data Explorer binary
  ansible.builtin.get_url:
    url: "{{ fts_binary_url }}"
    dest: "{{ fts_install_path }}"
    mode: "0755"
    timeout: 120

- name: Install FTS Data Explorer desktop entry
  ansible.builtin.copy:
    dest: /usr/share/applications/fts-data-explorer.desktop
    owner: root
    group: root
    mode: "0644"
    content: |
      [Desktop Entry]
      Name=FTS Data Explorer
      Comment=FTIR FTS data explorer
      Exec={{ fts_install_path }}
      Type=Application
      Categories=Science;Engineering;
      Terminal=false

# --- Digilent WaveForms + Adept runtime --------------------------------------
# files.digilent.com is behind a Cloudflare browser challenge and can answer
# 403 to get_url. If that happens, download the pinned .deb once in Firefox
# and place it in {{ digilent_deb_dir }}; get_url skips files that already exist.

- name: Download Digilent Adept runtime .deb
  ansible.builtin.get_url:
    url: "{{ digilent_adept_url }}"
    dest: "{{ digilent_deb_dir }}/{{ digilent_adept_url | basename }}"
    mode: "0644"
    headers: "{{ download_headers }}"
    timeout: 120

- name: Download Digilent WaveForms .deb
  ansible.builtin.get_url:
    url: "{{ digilent_waveforms_url }}"
    dest: "{{ digilent_deb_dir }}/{{ digilent_waveforms_url | basename }}"
    mode: "0644"
    headers: "{{ download_headers }}"
    timeout: 120

# The .debs are not rebuilt for new bases, so resolve their dependencies here
# by name. Without this, `apt: deb:` fails with an opaque "unmet dependencies"
# that only shows up as a failed unit in the journal.
- name: Install Adept runtime dependencies
  ansible.builtin.apt:
    name: "{{ digilent_adept_apt_deps }}"
    state: present

- name: Install WaveForms dependencies (Qt6 names vary by base)
  ansible.builtin.apt:
    name: "{{ digilent_waveforms_apt_deps + digilent_qt6_packages[ansible_distribution_major_version] }}"
    state: present

# Adept MUST be installed before WaveForms: the WaveForms binary links against
# the Adept runtime libraries (libdpcomm etc.) at load time, and its Depends
# line requires digilent.adept.runtime >= digilent_adept_min_version.
- name: Install Digilent Adept runtime
  ansible.builtin.apt:
    deb: "{{ digilent_deb_dir }}/{{ digilent_adept_url | basename }}"
  register: digilent_adept_install

# Assert rather than assume: if Adept silently failed, installing WaveForms
# produces a second, more confusing failure and leaves the laptop half set up.
- name: Read installed Adept runtime version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Status} ${Version}
      - digilent.adept.runtime
  register: digilent_adept_query
  changed_when: false
  failed_when: false

- name: Fail early when the Adept runtime is missing or too old
  ansible.builtin.assert:
    that:
      - "'install ok installed' in digilent_adept_query.stdout"
      - "(digilent_adept_query.stdout.split() | last) is version(digilent_adept_min_version, '>=')"
    fail_msg: >-
      Digilent Adept runtime is not usable: dpkg reports
      "{{ digilent_adept_query.stdout | default('nothing') }}", but WaveForms
      requires digilent.adept.runtime >= {{ digilent_adept_min_version }}.
      WaveForms was NOT installed. Check the Adept install output above.
    quiet: true

- name: Install Digilent WaveForms
  ansible.builtin.apt:
    deb: "{{ digilent_deb_dir }}/{{ digilent_waveforms_url | basename }}"
  register: digilent_waveforms_install

# Adept's own postinst reloads udev, but only when it is (re)installed. Trigger
# on every run where Adept is present: after a kernel update the rules must be
# re-applied even though neither .deb changed. This also keeps the reload from
# being skipped when WaveForms is already up to date.
- name: Reload udev rules for Digilent devices
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: false

- name: Re-trigger udev for plugged-in Digilent devices
  ansible.builtin.command: udevadm trigger
  changed_when: false
