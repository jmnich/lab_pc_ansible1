---
- name: Install base software suite
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove blacklisted packages
  ansible.builtin.apt:
    name: "{{ apt_packages_absent }}"
    state: absent
  when: apt_packages_absent | length > 0

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable unattended-upgrades periodic run
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Allow unattended-upgrades from Mint and Ubuntu origins
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52lab-unattended-origins
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "Ubuntu:${distro_codename}";
          "Ubuntu:${distro_codename}-security";
          "Linux Mint:${distro_codename}";
      };
