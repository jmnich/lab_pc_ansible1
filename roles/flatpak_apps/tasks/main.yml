---
- name: Install Flatpak
  ansible.builtin.apt:
    name: flatpak
    state: present

- name: Add Flathub remote (system-wide)
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present

- name: Install curated Flatpak apps
  community.general.flatpak:
    name: "{{ item }}"
    method: system
    state: present
  loop: "{{ flatpak_packages }}"

- name: Check codium flatpak launcher export exists
  ansible.builtin.stat:
    path: /var/lib/flatpak/exports/bin/codium
  register: codium_export

- name: Expose codium on the system PATH (works before re-login)
  ansible.builtin.file:
    src: /var/lib/flatpak/exports/bin/codium
    dest: /usr/local/bin/codium
    state: link
    force: true
  when: codium_export.stat.exists

- name: Remove blacklisted Flatpak apps
  community.general.flatpak:
    name: "{{ item }}"
    method: system
    state: absent
  loop: "{{ flatpak_packages_absent }}"
  when: flatpak_packages_absent | length > 0
