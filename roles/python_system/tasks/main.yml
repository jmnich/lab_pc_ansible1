---
- name: Read pinned PyPI package names from the reference freeze
  ansible.builtin.set_fact:
    python_pypi_names: "{{ lookup('ansible.builtin.file', role_path ~ '/files/' ~ python_requirements_file).splitlines() | map('regex_replace', '^\\s+|\\s+$', '') | reject('match', '^\\s*(#|$)') | map('regex_replace', '\\[.*?\\]', '') | map('regex_replace', '==.*$', '') | map('lower') | map('regex_replace', '[-_.]+', '-') | map('regex_replace', '^(.+)$', 'python3-\\1') | unique | list }}"

- name: Check which python3-* apt packages exist in the repositories
  ansible.builtin.command: apt-cache show {{ item }}
  loop: "{{ python_pypi_names }}"
  register: python_apt_check
  failed_when: false
  changed_when: false

- name: Select available python3-* apt packages
  ansible.builtin.set_fact:
    python_apt_install: "{{ python_apt_check.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"

- name: Install available Python packages from apt (python3-*)
  ansible.builtin.apt:
    name: "{{ python_apt_install }}"
    state: present
  when: python_apt_install | length > 0

- name: Report PyPI packages skipped (no python3-* apt equivalent)
  ansible.builtin.debug:
    msg: "Skipped (no apt package): {{ python_pypi_names | difference(python_apt_install) | join(', ') }}"
