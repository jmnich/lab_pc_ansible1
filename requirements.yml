---
# Ansible collections required by the playbook.
#
# Pinned to the last community.general series whose floor is ansible-core
# >= 2.9.10, so it works on every Mint 21+ base regardless of the packaged
# ansible-core. Newer series require ansible-core >= 2.11 (5.x/6.x) or
# >= 2.13 (8.x). Bump the pin when the fleet's base OS ships a newer
# ansible-core.
collections:
  - name: community.general
    version: "4.8.1"
